name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack code
        run: |
          unzip -q ViTune-fast.zip -d src
          g=$(find "$PWD/src" -name gradlew -print -quit)
          echo "PROJECT=$(dirname "$g")" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - name: Build debug APK
        run: |
          cd "$PROJECT"
          java -classpath gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: vitune-apk
          path: ${{ env.PROJECT }}/app/build/outputs/apk/debug/*.apk
